[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mt5-mcp"
version = "0.2.0"
description = "Servidor MCP para operar MetaTrader 5 desde Claude Code con límites de riesgo en código"
# Tope 3.15: el paquete oficial MetaTrader5 solo publica wheels Windows para CPython 3.6 a 3.14
requires-python = ">=3.11,<3.15"
dependencies = [
    "mcp>=1.2",
    "MetaTrader5>=5.0.45; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mt5-mcp = "mt5_mcp.server:main"

[tool.setuptools.packages.find]
include = ["mt5_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
